[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-mailbox"
dynamic = ["version"]
description = "File-backed Discord mailbox and connector for autonomous agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nitjsefnie" }]
keywords = ["discord", "mailbox", "agents", "connector"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = ["discord.py>=2.3", "psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/Nitjsefnie-Harness-Commons/discord-mailbox"
Issues = "https://github.com/Nitjsefnie-Harness-Commons/discord-mailbox/issues"

[project.scripts]
discord-mb = "discord_mb_lib.cli:_cli"

[tool.setuptools]
packages = ["discord_mb_lib"]

[tool.setuptools.dynamic]
# Single source of truth: the CLI's --version and the wheel can never disagree.
version = { attr = "discord_mb_lib.core.__version__" }
