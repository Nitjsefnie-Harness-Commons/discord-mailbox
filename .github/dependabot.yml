# Every dependency in this repo is pinned to an exact version, deliberately:
# a tool or library release must never turn CI red on an unchanged commit.
# The cost of that choice is that pins go stale silently, and a stale pin is
# how a fixed CVE stays exploitable. Dependabot pays that cost back — it is
# the counterpart to audit.yml, which detects the problem but cannot fix it.
#
# Note the interaction with the repo's CI policy: PRs are not built until an
# approving review lands (see tests.yml), so a Dependabot PR sits unbuilt
# until a human looks at it. That is the existing policy working as intended,
# not an extra cost of enabling this — an unreviewed bump is exactly the kind
# of change that should not get a runner.
#
# There is no npm entry: this repo has no JavaScript at all.

version: 2
updates:
  # requirements-dev.in (CI tools) and requirements-build.in, recompiled
  # into their hash-pinned .txt.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope

  # The runtime lock (discord.py, psutil and their tree). Away from
  # pyproject.toml, so it compiles on the Python its header names.
  - package-ecosystem: pip
    directory: "/.github/workflows"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope

  # The workflows pin every action to a commit SHA with the version in a
  # trailing comment. A SHA pin does not move at all — which is the point,
  # since these jobs run with a repository token — and it is also why this
  # entry is not optional: without Dependabot a SHA pin is simply frozen
  # forever. It rewrites both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # Every codeql-action step must stay on one version, so a bump may never
    # split; a group covers one update kind only, hence one per kind.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
