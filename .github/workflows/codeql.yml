name: codeql

# Static security analysis (advanced setup, not the repo-settings "default
# setup": the config lives here, reviewable in a diff). Free on this public
# repository; findings land in the Security tab rather than turning the
# build red, so a new upstream query cannot block an unrelated push.
#
# TRIGGER DIFFERS FROM THE OTHER WORKFLOWS ON PURPOSE. The rest of the
# suite builds on `pull_request_review` once an approving review lands.
# CodeQL does not, because `analyze` uploads its SARIF against the ref and
# SHA of the *event*, while our checkout step deliberately takes
# `pull_request.head.sha`. On a review event those two are different
# commits, so the alerts would be filed against a tree that was never the
# one analysed. A mergeable same-repo PR's head is analysed, merged onto its
# base, by its `pull_request` run (its push run skips once the lookup sees
# it mergeable); `push` covers the rest.
#
# The weekly cron is not redundant with push: CodeQL's query packs are
# updated continuously, and a new query only ever runs against code that
# has changed since it shipped. Without it, a rule published today would
# never reach a file last touched last year.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  schedule:
    # Wednesday 03:47 UTC. Off the hour and off Monday deliberately: the top
    # of the hour is when every cron on GitHub fires at once and jobs queue.
    - cron: '47 3 * * 3'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push to a branch whose open, mergeable pull request runs these gates
  # skips the jobs below; a skipped check passes. A skipped job's `name:`
  # shows unevaluated, so its `${{ }}` keeps it off the gate's required
  # check name: keep it. `!cancelled()` runs them if this lookup fails.
  guard:
    uses: ./.github/workflows/open-pull-request.yml
    permissions:
      pull-requests: read

  analyze:
    # No skip-note in the name: `if:` is evaluated before the matrix
    # expands, so a skipped run is never named `analyze (python)`.
    name: analyze (${{ matrix.language }})
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip-note == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Writing the analysis results is the whole point; everything else
      # stays read-only.
      security-events: write
      actions: read
      contents: read

    strategy:
      # One entry per language: python for the package, actions for the
      # workflow files.
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:` here, unlike the other workflows: CodeQL must analyse
          # exactly the commit it will file alerts against, which is the
          # event's own SHA.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` over the default `security` pack: this code parses
          # untrusted transcript and config files off disk and builds paths
          # from their contents, which is what the extra precision-medium
          # queries are good at.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
