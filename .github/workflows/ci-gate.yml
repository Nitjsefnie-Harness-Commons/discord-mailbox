name: ci gate

# One check over every job of the workflows scripts/ci/ci_gate.py covers.

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fold the covered workflows' jobs into one verdict
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_MAILBOX_REPO: ${{ github.repository }}
          DISCORD_MAILBOX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/ci_gate.py
