name: secrets

# The daily run catches commits no run saw.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event: cron and dispatch never cancel a push.
  group: secrets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # it scans all history
          persist-credentials: false

      - name: Download gitleaks and verify its digest
        run: |
          curl --connect-timeout 5 --max-time 120 -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the tree and the history
        # Bare: exit status gates; --redact: public log.
        run: ./gitleaks detect --verbose --redact --ignore-gitleaks-allow --config .gitleaks.toml
