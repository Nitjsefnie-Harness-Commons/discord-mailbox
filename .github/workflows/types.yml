name: types

# pyright over the shipped package and its facade. The suites are excluded in
# pyrightconfig.json: they monkeypatch module attributes and replace stdlib
# modules on purpose, which a type checker can only ever call an error.
#
# pythonPlatform is "All" rather than the runner's, because this package
# genuinely targets both -- the msvcrt branches are as real as the fcntl ones
# and are guarded at runtime, not by the platform the check happens to run on.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the tree. Without an explicit
# block it inherits the repository default, which can be read/write
# for the whole token.
permissions:
  contents: read

concurrency:
  group: types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push to a branch whose open, mergeable pull request runs these gates
  # skips the jobs below; a skipped check passes. A skipped job's `name:`
  # shows unevaluated, so its `${{ }}` keeps it off the gate's required
  # check name: keep it. `!cancelled()` runs them if this lookup fails.
  guard:
    uses: ./.github/workflows/open-pull-request.yml
    permissions:
      pull-requests: read

  pyright:
    name: pyright${{ needs.guard.outputs.skip-note }}
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip-note == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-*.txt
            .github/workflows/requirements-runtime.txt

      - name: Install the type checker and the runtime dependencies
        # discord.py and psutil are imported by the code being checked, so
        # without them every `import discord` is an unresolved-import error and
        # the gate fails on the environment rather than on the source.
        # One command per manifest: Dependabot bumps a pin they share in
        # separate pull requests, and one command refuses two pins.
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --require-hashes -r .github/workflows/requirements-runtime.txt
          pip install --require-hashes -r requirements-build.txt

      - name: Install the project
        # A step of its own: hash-checking mode refuses a local directory.
        # No build isolation, so the backend is requirements-build.txt's.
        run: pip install --no-deps --no-build-isolation .

      - name: pyright
        run: pyright
