name: tag

# Creates the tag that release.yml consumes.
#
# release.yml publishes once a `v*` tag exists, but has no way to know WHEN:
# someone has to remember to tag after bumping __version__, and a forgotten
# tag is a version bump that never ships. So this watches the one file that
# carries the version, creates the tag, and then STARTS release.yml by hand.
# A tag created with the built-in GITHUB_TOKEN triggers no workflow at all:
# GitHub suppresses runs from token-authored events so a workflow cannot loop
# on its own pushes, and `workflow_dispatch` is one of the documented
# exceptions. Without the dispatch the tag lands, no release is cut, and
# nothing goes red.
#
# `version` holds a read-only token: it resolves the commit, checks it out and
# builds the package to read its version. `tag` holds the write token and runs
# no repository or third-party code, only `gh`, `jq` and shell tools: it
# waits for the other gates, creates the tag through the API and dispatches
# release.yml. It waits although release.yml waits again before publishing,
# because a tag on a red commit outlives the mistake.

on:
  push:
    branches: [main]
    paths:
      # The narrowest possible allow-list: the file that holds __version__.
      # That is core.py -- __init__.py is a docstring and defines nothing, so
      # watching it would mean a version bump touches no watched path and this
      # workflow is never scheduled at all.
      - 'discord_mb_lib/core.py'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to tag (default: the branch tip)'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    # `bash -eo pipefail`, not the default `bash -e`: a `gh` failure inside a
    # pipeline fails the step instead of handing jq a partial listing.
    shell: bash

concurrency:
  # NOT cancel-in-progress: a superseded test run teaches you nothing and is
  # worth cancelling; a superseded tag run may be midway through creating a
  # tag.
  group: tag
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.retag.outputs.skip }}

    steps:
      - name: Resolve the commit to tag
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
        # A dispatch names any commit from any branch, so the input and the
        # default alike must be a full SHA that main contains. The shape is
        # checked first: the compare API also resolves short and uppercase SHAs;
        # `ahead` or `identical` means the commit is main or an ancestor of it.
        run: |
          if [ "${#SHA}" -ne 40 ] || [ -n "${SHA//[0-9a-f]/}" ]; then
            echo "Not a full lowercase commit SHA: '$SHA'" >&2
            exit 1
          fi
          status="$(gh api -H "Cache-Control: no-cache" \
            "repos/$REPO/compare/$SHA...refs/heads/main" --jq .status)"
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "$SHA is not on main (compare status: $status); refusing." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      - name: Read and validate the version
        id: version
        # Ask the BUILT DISTRIBUTION rather than grepping the file: pyproject
        # resolves the distribution version from `discord_mb_lib.core`, so the
        # only way to be sure the tag and the wheel agree is to read what the
        # build produced.
        #
        # Not by importing it. `import discord_mb_lib` reaches a package that
        # defines no `__version__` at all, and importing `discord_mb_lib.core`
        # instead would need discord.py and psutil that this job has no reason
        # to install. `--no-deps` builds the distribution without them, and
        # importlib.metadata reads the recorded version without importing any
        # of it. Only a plain X.Y.Z is a release.
        run: |
          python3 -m pip install --quiet --require-hashes -r requirements-build.txt
          python3 -m pip install --quiet --no-deps --no-build-isolation .
          version="$(python3 -c 'import importlib.metadata as m; print(m.version("discord-mailbox"))')"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "__version__ is not a plain X.Y.Z release: '$version'" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version is $version"

      - name: Refuse to re-tag an existing version
        id: retag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        # An existing tag means either a mistaken edit or a rerun after a
        # partial failure. Both want a human, and both are silent if this
        # step is a no-op instead of an error.
        #
        # One exception: a push whose __version__ line matches the one at the
        # push's `before` commit. The path filter watches all of core.py, so
        # such a push is only a code edit and released nothing. Both lines
        # must be read and equal to skip; a failed read leaves the refusal in
        # force. A missing tag never skips, so a bump whose tagging failed
        # still gets tagged.
        run: |
          if gh api -H "Cache-Control: no-cache" \
               "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            pat='^__version__ *='
            now="$(grep -E "$pat" discord_mb_lib/core.py || true)"
            if [ -z "$now" ]; then
              echo "No line matching $pat in discord_mb_lib/core.py; refusing." >&2
              exit 1
            fi
            before=""
            if [ "$EVENT" = push ]; then
              # An empty ref= would read the default branch.
              if [ -n "$BEFORE" ]; then
                before="$(gh api -H "Cache-Control: no-cache" \
                    -H "Accept: application/vnd.github.raw+json" \
                    "repos/$REPO/contents/discord_mb_lib/core.py?ref=$BEFORE" \
                    2>/dev/null | grep -E "$pat" || true)"
              fi
              if [ -z "$before" ]; then
                echo "Could not read __version__ at $BEFORE; refusing as usual." >&2
              fi
            fi
            if [ -n "$now" ] && [ "$now" = "$before" ]; then
              echo "$TAG already exists and this push left the version alone:"
              echo "nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $TAG already exists — __version__ was set to a version" >&2
            echo "that has already shipped. Bump it further, or delete that" >&2
            echo "tag and its release if it was cut in error." >&2
            exit 1
          fi
          echo "$TAG is free"

  tag:
    # No `name:`, so `github.job` is this job's check-run name, which
    # release.yml's waiter excludes by that exact name. Skipped, it passes.
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write # creates the tag object and its ref
      actions: write # lists this commit's workflow runs, dispatches release.yml
      checks: read # reads the other checks on this commit

    steps:
      - name: Wait for the other gates on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.version.outputs.sha }}
          # Matched by equality: this job, or it would wait on itself.
          EXCLUDED: ${{ github.job }}
        # Counts only check runs of push and pull_request workflow runs, so a
        # comment-triggered run neither gates nor blocks. It needs at least one
        # other check that is not `skipped`; a push run's own `version` job
        # already counts, so only a dispatched run waits for CI to be
        # scheduled. `cancelled` fails: a superseded commit is not released.
        # Check runs are read first: a workflow run starting between the two
        # reads is counted on the next poll instead of having its checks dropped.
        run: |
          deadline=$(( SECONDS + 45 * 60 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            checks="$(gh api --paginate -H "Cache-Control: no-cache" \
              "repos/$REPO/commits/$SHA/check-runs?per_page=100")"
            suites="$(gh api --paginate -H "Cache-Control: no-cache" \
              "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              | jq -s '[.[].workflow_runs[]
                        | select(.event == "push" or .event == "pull_request")
                        | .check_suite_id]')"
            runs="$(printf '%s' "$checks" \
              | jq -r --argjson suites "$suites" --arg excluded "$EXCLUDED" '
                  ($excluded | split("\n")) as $ex
                  | .check_runs[]
                  | select(.check_suite.id | IN($suites[]))
                  | select(.name | IN($ex[]) | not)
                  | "\(.status)\t\(.conclusion)\t\(.name)"')"

            if [ -z "$(echo "$runs" | awk -F'\t' '$2 != "skipped"')" ]; then
              echo "no other check runs reported yet, waiting..."
              sleep 20
              continue
            fi

            pending="$(echo "$runs" | grep -cv '^completed' || true)"
            if [ "$pending" -gt 0 ]; then
              echo "$pending check(s) still running:"
              echo "$runs" | grep -v '^completed' | awk '{print "    " $0}'
              sleep 20
              continue
            fi

            echo "All checks completed:"
            echo "$runs" | awk '{print "    " $0}'
            bad="$(echo "$runs" \
              | awk -F'\t' '$2 != "success" && $2 != "skipped" && $2 != "neutral"')"
            if [ -n "$bad" ]; then
              echo "Refusing to proceed: these checks did not pass:" >&2
              echo "$bad" | awk '{print "    " $0}' >&2
              exit 1
            fi
            echo "Every check passed — proceeding."
            exit 0
          done
          echo "Timed out after 45 minutes waiting for checks on $SHA" >&2
          exit 1

      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.version.outputs.sha }}
          TAG: ${{ needs.version.outputs.tag }}
        # An annotated tag, which records who created it and when: the tag
        # object first, then the ref under refs/tags that names it.
        run: |
          object="$(gh api --method POST "repos/$REPO/git/tags" \
            -f tag="$TAG" -f message="$TAG" -f object="$SHA" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --jq .sha)"
          gh api --method POST "repos/$REPO/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null
          echo "Created $TAG at $SHA."
          {
            echo "### Tagged \`$TAG\`"
            echo
            echo "Commit \`$SHA\`, after every check on it passed."
            echo "\`release.yml\` builds and publishes the wheel from here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        # release.yml also triggers on `push: tags: v*`, which fires for a
        # tag a HUMAN pushes but not for one created with GITHUB_TOKEN.
        # Dispatching is the documented way through, and the two compose: on
        # a release that already exists, release.yml uploads only missing
        # assets and fails without uploading if one there differs.
        run: |
          gh workflow run release.yml --repo "$REPO" --ref "$TAG"
          echo "Dispatched release.yml against $TAG."
          {
            echo "\`release.yml\` dispatched against \`$TAG\`; it builds"
            echo "and publishes the wheel and its checksums from there."
          } >> "$GITHUB_STEP_SUMMARY"
