name: open pull request

# Set on a push to the head of an open pull request whose `mergeable` is
# true (null: computing; false: no pull_request run). Text never shown.

on:
  workflow_call:
    outputs:
      skip-note:
        value: ${{ jobs.lookup.outputs.skip-note }}

permissions: {}

jobs:
  lookup:
    if: >-
      github.event_name == 'push'
      && github.ref_type == 'branch'
      && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      skip-note: ${{ steps.find.outputs.skip-note }}

    steps:
      - name: Find a mergeable open pull request from this branch
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.repository_owner }}:${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          number="$(gh api --method GET "repos/$REPO/pulls" -f state=open -f head="$HEAD" --jq '.[0].number // empty')"
          [ -n "$number" ] || exit 0
          for attempt in 1 2 3 4; do
            state="$(gh api -H 'Cache-Control: no-cache' "repos/$REPO/pulls/$number" --jq '"\(.head.sha) \(.mergeable)"')"
            case "$state" in
              "$SHA true") echo "skip-note= (pull request #$number)" >> "$GITHUB_OUTPUT"; exit 0 ;;
              "$SHA false") exit 0 ;;
            esac
            echo "attempt $attempt: $state"
            [ "$attempt" -eq 4 ] || sleep 8
          done
