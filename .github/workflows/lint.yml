name: lint

# Two gates, one job each so a failure says which tool found it.
#
# Style opinions stay off (max-line-length = 10000 in setup.cfg, and .pylintrc
# disables the formatting and metric checks): they exist for real defects.
# Every .pylintrc disable names its pattern; the type gate runs against the
# shipped package rather than the suites, which monkeypatch module attributes
# no type checker can model.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the tree. Without an explicit
# block it inherits the repository default, which can be read/write
# for the whole token.
permissions:
  contents: read

concurrency:
  group: lint-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # A push to a branch whose open, mergeable pull request runs these gates
  # skips the jobs below; a skipped check passes. A skipped job's `name:`
  # shows unevaluated, so its `${{ }}` keeps it off the gate's required
  # check name: keep it. `!cancelled()` runs them if this lookup fails.
  guard:
    uses: ./.github/workflows/open-pull-request.yml
    permissions:
      pull-requests: read

  pycodestyle:
    name: pycodestyle${{ needs.guard.outputs.skip-note }}
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip-note == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install linters
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: pycodestyle
        run: git ls-files '*.py' | xargs pycodestyle

  pylint:
    name: pylint${{ needs.guard.outputs.skip-note }}
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip-note == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install linters
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: pylint
        run: git ls-files '*.py' | xargs pylint --rcfile=.pylintrc
