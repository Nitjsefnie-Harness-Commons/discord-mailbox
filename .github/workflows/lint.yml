name: lint

# Style gate, modelled on the house lint.yml but currently pycodestyle only.
# pylint and pyright are configured in this repo (.pylintrc,
# pyrightconfig.json) and deliberately NOT wired yet: measured at the initial
# commit they report 1177 and 240 findings respectively, dominated by patterns
# this codebase uses on purpose -- tests reach into underscore-prefixed
# internals, the package re-exports through wildcard imports pylint cannot
# follow, and the suites monkeypatch module attributes that pyright types as
# fixed. Wiring a gate that is red from its first run trains everyone to
# ignore it, so those two are tracked in the issue instead of being faked
# green with a blanket disable.
#
# Style opinions stay off (max-line-length = 10000 in setup.cfg): this exists
# for real defects, not formatting preferences.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pycodestyle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pycodestyle
        run: git ls-files '*.py' | xargs pycodestyle
