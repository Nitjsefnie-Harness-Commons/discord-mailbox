name: perf

# scripts/ci/perf_gate.py counts each workload in callgrind instructions,
# never wall-clock time, against .github/perf-budget.json.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # A push an open, mergeable pull request gates skips perf. A skipped job
  # shows its `name:` unevaluated, which keeps it off the gated check name.
  guard:
    uses: ./.github/workflows/open-pull-request.yml
    permissions:
      pull-requests: read

  perf:
    name: perf${{ needs.guard.outputs.skip-note }}
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip-note == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The raise check reads every commit since the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Read the budgeted Python
        id: python
        run: echo "version=$(jq -er .python .github/perf-budget.json)" >> "$GITHUB_OUTPUT"

      # The interpreter build decides the counts.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Install the runtime dependencies and the project
        run: |
          python -m pip install --require-hashes -r .github/workflows/requirements-runtime.txt
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Install valgrind
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 valgrind

      - name: Measure
        id: measure
        run: python scripts/ci/perf_gate.py measure --out "$RUNNER_TEMP/perf-counts.json"

      - name: Upload the counts
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-counts
          path: ${{ runner.temp }}/perf-counts.json
          if-no-files-found: error

      - name: Check the counts against the budget
        # HEAD is the merge of the pull request into the base tip HEAD^1.
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git cat-file -e HEAD^1:.github/perf-budget.json 2>/dev/null; then
              git show HEAD^1:.github/perf-budget.json > "$RUNNER_TEMP/base-perf-budget.json"
              args+=(--base-budget "$RUNNER_TEMP/base-perf-budget.json")
            fi
            args+=(--range "$(git merge-base HEAD^1 HEAD^2)..HEAD^2")
          fi
          python scripts/ci/perf_gate.py check --counts "$RUNNER_TEMP/perf-counts.json" \
            --budget .github/perf-budget.json "${args[@]}"

      - name: Stage the lowered budgets
        id: tighten
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DISCORD_MAILBOX_BASE_SHA: ${{ github.sha }}
        run: |
          data="$RUNNER_TEMP/ratchet-data"
          mkdir -p "$data/.github"
          status=0
          python scripts/ci/perf_gate.py tighten --counts "$RUNNER_TEMP/perf-counts.json" \
            --budget .github/perf-budget.json --output "$data/.github/perf-budget.json" || status=$?
          case "$status" in
            0) printf '%s\n' "$DISCORD_MAILBOX_BASE_SHA" > "$data/base.txt"
               echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Upload the lowered budgets
        if: ${{ steps.tighten.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-push
          path: ${{ runner.temp }}/ratchet-data/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
