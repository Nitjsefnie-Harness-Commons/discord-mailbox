name: coverage comment

# Posts the patch-coverage report the tests workflow staged on a pull request.
# The tests job runs the proposed tree, so the token that writes the comment
# lives here, where nothing is checked out and the artifact's two text files
# are read and posted, never run. The target pull request comes from the
# event; the artifact's pr-number.txt is only compared with it.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

concurrency:
  # Keyed on the head repository and branch, so another fork's branch of the
  # same name cannot cancel this run.
  group: >-
    coverage-comment-${{
    github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check for the comment artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_MAILBOX_REPO: ${{ github.repository }}
          DISCORD_MAILBOX_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! gh api -H 'Cache-Control: no-cache' --paginate \
            "repos/$DISCORD_MAILBOX_REPO/actions/runs/$DISCORD_MAILBOX_RUN_ID/artifacts" \
            --jq '.artifacts[]' > artifacts.json
          then
            echo "listing the artifacts of run $DISCORD_MAILBOX_RUN_ID failed" >&2
            exit 1
          fi
          present="$(jq -s 'any(.[]; .name == "diff-coverage-comment" and
            .expired == false)' artifacts.json)"
          case "$present" in
            true) echo 'present=true' >> "$GITHUB_OUTPUT" ;;
            false)
              echo 'diff-coverage-comment is absent; nothing to post.'
              ;;
            *)
              echo "unexpected artifact lookup result: $present" >&2
              exit 1
              ;;
          esac

      - name: Resolve the target pull request from the event
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_MAILBOX_REPO: ${{ github.repository }}
          DISCORD_MAILBOX_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISCORD_MAILBOX_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          DISCORD_MAILBOX_EVENT_NUMBERS: >-
            ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
        run: |
          set -euo pipefail
          numbers="$(printf '%s' "$DISCORD_MAILBOX_EVENT_NUMBERS" | jq -r 'arrays | .[]' \
            | sort -u)"
          if [ -z "$numbers" ]; then
            # A fork pull request's event lists none; ask the head repository.
            if ! gh api -H 'Cache-Control: no-cache' --paginate \
              "repos/$DISCORD_MAILBOX_HEAD_REPO/commits/$DISCORD_MAILBOX_HEAD_SHA/pulls" \
              --jq '.[].number' > pulls.txt
            then
              echo "listing the pull requests for $DISCORD_MAILBOX_HEAD_SHA failed" >&2
              exit 1
            fi
            numbers="$(sort -u pulls.txt)"
          fi
          count="$(printf '%s\n' "$numbers" | awk 'NF' | wc -l | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "expected one pull request for $DISCORD_MAILBOX_HEAD_SHA, found $count" >&2
            printf '%s\n' "$numbers" >&2
            exit 1
          fi
          case "$numbers" in
            ''|*[!0-9]*)
              echo "resolved a non-numeric pull request: $numbers" >&2
              exit 1
              ;;
          esac
          if ! current_sha="$(gh api -H 'Cache-Control: no-cache' \
            "repos/$DISCORD_MAILBOX_REPO/pulls/$numbers" --jq '.head.sha')"
          then
            echo "reading the current head of pull request $numbers failed" >&2
            exit 1
          fi
          if [ -z "$current_sha" ]; then
            echo "pull request $numbers has no current head SHA" >&2
            exit 1
          fi
          if [ "$current_sha" != "$DISCORD_MAILBOX_HEAD_SHA" ]; then
            echo "run $DISCORD_MAILBOX_HEAD_SHA is stale; current pull request head is" \
              "$current_sha"
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$numbers" >> "$GITHUB_OUTPUT"
          echo 'stale=false' >> "$GITHUB_OUTPUT"

      - name: Download the comment artifact
        if: >-
          steps.artifact.outputs.present == 'true'
          && steps.pr.outputs.stale != 'true'
          && steps.pr.outputs.present != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diff-coverage-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the pull request comment
        if: >-
          steps.artifact.outputs.present == 'true'
          && steps.pr.outputs.stale != 'true'
          && steps.pr.outputs.present != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_MAILBOX_REPO: ${{ github.repository }}
          DISCORD_MAILBOX_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISCORD_MAILBOX_PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          test -f body.md
          test -f pr-number.txt
          claimed="$(cat pr-number.txt)"
          if [ "$claimed" != "$DISCORD_MAILBOX_PR_NUMBER" ]; then
            echo "the artifact names pull request '$claimed' but the run" \
              "belongs to '$DISCORD_MAILBOX_PR_NUMBER'; refusing to post" >&2
            exit 1
          fi
          # A comment body holds at most 65536 characters; refuse, never truncate.
          size="$(wc -c < body.md)"
          if [ "$size" -gt 60000 ]; then
            echo "body.md is $size bytes, past the comment limit" >&2
            exit 1
          fi
          marker='<!-- discord-mailbox-diff-coverage -->'
          {
            printf '%s\n\n' "$marker"
            printf 'Measured at %s.\n\n' "$DISCORD_MAILBOX_HEAD_SHA"
            cat body.md
          } > comment.md
          if ! gh api -H 'Cache-Control: no-cache' --paginate \
            "repos/$DISCORD_MAILBOX_REPO/issues/$DISCORD_MAILBOX_PR_NUMBER/comments" \
            --jq '.[]' > comments.json
          then
            echo "listing the comments on $DISCORD_MAILBOX_PR_NUMBER failed" >&2
            exit 1
          fi
          existing="$(
            jq -s --arg marker "$marker" 'map(select(
              .user.login == "github-actions[bot]" and
              ((.body // "") | startswith($marker)))) | .[0].id // empty' comments.json
          )"
          revalidate_head() {
            if ! current_sha="$(gh api -H 'Cache-Control: no-cache' \
              "repos/$DISCORD_MAILBOX_REPO/pulls/$DISCORD_MAILBOX_PR_NUMBER" --jq '.head.sha')"
            then
              echo "reading the current head of pull request $DISCORD_MAILBOX_PR_NUMBER" \
                "failed" >&2
              exit 1
            fi
            if [ -z "$current_sha" ]; then
              echo "pull request $DISCORD_MAILBOX_PR_NUMBER has no current head SHA" >&2
              exit 1
            fi
            if [ "$current_sha" != "$DISCORD_MAILBOX_HEAD_SHA" ]; then
              echo "run $DISCORD_MAILBOX_HEAD_SHA is stale; current pull request head is" \
                "$current_sha"
              return 1
            fi
          }
          case "$existing" in
            '')
              if ! revalidate_head; then
                exit 0
              fi
              gh api -X POST "repos/$DISCORD_MAILBOX_REPO/issues/$DISCORD_MAILBOX_PR_NUMBER/comments" \
                -F body=@comment.md >/dev/null
              echo 'posted a new comment'
              ;;
            *[!0-9]*)
              echo "comment id is not only digits: $existing" >&2
              exit 1
              ;;
            *)
              if ! revalidate_head; then
                exit 0
              fi
              gh api -X PATCH "repos/$DISCORD_MAILBOX_REPO/issues/comments/$existing" \
                -F body=@comment.md >/dev/null
              echo "updated comment $existing"
              ;;
          esac
