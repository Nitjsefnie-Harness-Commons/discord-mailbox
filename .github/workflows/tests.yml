name: tests

# Modelled on the house tests.yml, with one deliberate difference: a matrix.
# gh-widgets is single-runner because it is pure stdlib with no OS surface.
# This code has plenty -- msvcrt vs fcntl byte-range locking, 8.3 short paths,
# reparse points -- and the recent connector and installer bugs were all
# Windows-only and invisible to a Linux-only run. Running the suites free on
# public runners across three OSes is the reason this repo is public.
#
# The suites are stdlib-only and offline (no gateway, no network), so the only
# install step is the two runtime dependencies.

on:
  push:
    # Deny-list rather than an allow-list: a new top-level code directory
    # would silently stop being tested under an allow-list, whereas an
    # unlisted path here just runs CI needlessly.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the tree. Without an explicit
# block it inherits the repository default, which can be read/write
# for the whole token.
permissions:
  contents: read

concurrency:
  # A push that supersedes an in-flight run for the same ref cancels it --
  # nothing is learned from CI for a commit that is already history.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip discord.py psutil

      - name: Run every mailbox suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python run_tests.py

  wheel:
    # Proves the published artifact, not just the checkout: an import that
    # resolves only because the source tree is on sys.path would pass the
    # suites above and still ship a wheel that cannot start.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install it with no checkout in reach and run it
        run: |
          python -m venv "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/probe/bin/discord-mb" --version
          "$RUNNER_TEMP/probe/bin/python" -c "from discord_mb_lib.cli import _cli"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/*.whl

  portable:
    # macOS has no O_TMPFILE and Windows has no equivalent, so on both of them
    # every publication takes the portable named path -- a protocol the Linux
    # lanes above never execute even once, which is how a crash-recovery bug in
    # it reached CI unnoticed. This lane forces that path on a free runner, and
    # points TMPDIR at a symlink so the macOS /var -> /private/var aliasing is
    # exercised with it.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip discord.py psutil

      - name: Run every mailbox suite on the portable publication path
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DISCORD_MB_PORTABLE_PUBLICATION: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/portable-real"
          ln -sfn "$RUNNER_TEMP/portable-real" "$RUNNER_TEMP/portable-tmp"
          TMPDIR="$RUNNER_TEMP/portable-tmp" python run_tests.py

  coverage:
    # A JOB of its own, not steps inside the matrix above: the matrix is
    # 3 OSes x 3 Pythons, and coverage of the same code nine times over
    # tells you the same number nine times. One run, on the newest Python
    # and the cheapest runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install the coverage toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Measure
        id: measure
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # Each suite in its OWN subprocess with --parallel-mode, then
        # combined — because that is exactly what run_tests.py does, and
        # measuring a different execution shape than CI actually runs would
        # report coverage for a program nobody executes. A failing suite
        # does not fail this job: tests.yml above owns that verdict, and the
        # gate below is about how much code was reached.
        run: |
          shopt -s nullglob
          suites=(tests/test_*.py)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "no suites found — refusing to report 0% as a pass" >&2
            exit 1
          fi
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            python -m coverage run --parallel-mode --source=discord_mb_lib "$suite" \
              || echo "  (suite did not pass; its coverage still counts)"
            echo "::endgroup::"
          done
          python -m coverage combine

      - name: Coverage summary
        # Renders whether or not the gate below passes — a coverage
        # regression is only actionable if you can see WHICH file lost
        # lines, and re-reading a scrolled CI log to find that is exactly
        # the friction that gets a gate disabled.
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        run: |
          {
            echo '### Coverage'
            echo
            python -m coverage report --format=markdown --precision=1
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml -o coverage.xml

      - name: Upload coverage.xml
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Coverage gate
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        # A RATCHET, not a target. 48 sits just under the 50.3%
        # measured when this landed, so ordinary churn stays green and a real
        # regression goes red. Raise the floor by hand as coverage climbs —
        # never lower it to make a red build green.
        run: python -m coverage report --fail-under=48 --precision=1
