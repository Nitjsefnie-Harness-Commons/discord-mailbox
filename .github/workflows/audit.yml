name: audit

# Dependency vulnerability gate: every hash-pinned manifest CI installs
# lists its full transitive tree, and pip-audit checks each pinned version
# against the PyPI advisory database and OSV.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  schedule:
    - cron: '12 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # A push to a branch whose open, mergeable pull request runs these gates
  # skips the jobs below; a skipped check passes. A skipped job's `name:`
  # shows unevaluated, so its `${{ }}` keeps it off the gate's required
  # check name: keep it. `!cancelled()` runs them if this lookup fails.
  guard:
    uses: ./.github/workflows/open-pull-request.yml
    permissions:
      pull-requests: read

  pip-audit:
    name: pip-audit${{ needs.guard.outputs.skip-note }}
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip-note == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the dev toolchain
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Audit dependencies
        # The runtime lock (discord.py, psutil and their tree) and every
        # toolchain lock: the toolchain runs in CI holding the repository
        # token, and a compromised linter is a supply-chain problem even
        # though it never ships.
        #
        # --disable-pip audits the pins as written; without it pip-audit
        # resolves each file again in a scratch venv it first upgrades with
        # an unpinned `pip install --upgrade pip wheel setuptools`. One pass
        # per manifest: the runtime lock moves in Dependabot updates of its
        # own, so a pin it shares with a root manifest can differ for a while.
        #
        # THE RETRY IS NARROW ON PURPOSE. pip-audit queries PyPI over the
        # network, and a reset connection produces the same exit status as a
        # real finding. A blanket retry would re-run a genuine vulnerability
        # three times before reporting it, and a gate that goes red for
        # reasons unrelated to its subject is one people learn to ignore. So
        # this retries ONLY on a transport error and reports anything else
        # immediately and verbatim.
        run: |
          audit() {
            for attempt in 1 2 3; do
              if pip-audit --progress-spinner off "$@" > audit.out 2>&1; then
                cat audit.out
                return 0
              fi
              if grep -qiE 'connection (aborted|reset|error)|read timed out|temporary failure in name resolution' audit.out; then
                echo "attempt $attempt: transport failure talking to PyPI, retrying"
                tail -n 5 audit.out
                sleep $(( attempt * 15 ))
                continue
              fi
              echo "pip-audit reported findings for: $*" >&2
              cat audit.out >&2
              return 1
            done
            echo "pip-audit could not reach PyPI after 3 attempts:" >&2
            cat audit.out >&2
            return 1
          }

          for manifest in .github/workflows/requirements-*.txt requirements-*.txt; do
            echo "::group::$manifest"
            audit --disable-pip -r "$manifest"
            echo "::endgroup::"
          done
