[pycodestyle]
max-line-length = 10000
exclude = .idea, .venv, build, dist
# E402 only: discord_mb.py is a compatibility facade that must extend sys.path
# before importing the package it re-exports, so its imports cannot come first.
# Every other code is enforced -- the gate exists for real defects, and a rule
# the code structurally cannot satisfy would be the one that trains people to
# ignore the output.
# `ignore` REPLACES pycodestyle's defaults rather than adding to them, and
# pycodestyle has no extend-ignore (that is flake8), so the defaults are
# restated here. Dropping them re-enables the mutually exclusive W503/W504
# pair and turns 12 findings into 203.
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E402
